name: Deploy to GitHub Pages

# Pages serves one artifact per site, so a branch cannot publish on its own.
# Both branches are built here and packed into a single tree: master at the
# site root, staging under /staging. A push to either branch rebuilds both,
# which keeps the other half of the site from disappearing.
on:
  push:
    branches: [master, staging]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - id: master
        uses: actions/checkout@v7
        with:
          ref: master
          path: master
      - id: staging
        continue-on-error: true
        uses: actions/checkout@v7
        with:
          ref: staging
          path: staging
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: master/package-lock.json
      - name: Build master
        working-directory: master
        run: |
          npm ci
          npm run build
      - name: Build staging
        if: steps.staging.outcome == 'success'
        working-directory: staging
        run: |
          npm ci
          npm run build
      # base is './', so the same build works at the root and one level down.
      - name: Pack the site
        run: |
          mv master/dist site
          if [ -d staging/dist ]; then mv staging/dist site/staging; fi
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
