name: CI Moebius Atlas

# Pages serves one artifact per site, so a branch cannot publish on its own.
# Both branches are built here and packed into a single tree: master at the
# site root, staging under /staging. A push to either branch rebuilds both,
# which keeps the other half of the site from disappearing.
on:
  push:
    branches: [master, staging]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-24.04
    steps:
      - id: master
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: master
          path: master
      - id: staging
        continue-on-error: true
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: staging
          path: staging
      - name: Verify
        run: |
          python3 master/tools/check_graph.py
          if [ -d staging ]; then python3 staging/tools/check_graph.py; fi
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: master/package-lock.json
      # The Google sign-in needs its OAuth client id at build time. It is a
      # public value, so it is a repository *variable*, not a secret; unset, the
      # site simply builds without the account row.
      - name: Build master
        working-directory: master
        env:
          VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID }}
        run: |
          npm ci
          npm run build
      - name: Build staging
        if: steps.staging.outcome == 'success'
        working-directory: staging
        env:
          VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID }}
        run: |
          npm ci
          npm run build
      # base is './', so the same build works at the root and one level down.
      - name: Pack the site
        run: |
          mv master/dist site
          if [ -d staging/dist ]; then mv staging/dist site/staging; fi
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
